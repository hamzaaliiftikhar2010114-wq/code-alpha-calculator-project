<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="calculator.css">
</head>

<body>
    <main class="calculator">
        <h1>Calculator</h1>

        <input type="text" id="display" value="0" readonly aria-label="Calculator display">

        <div class="buttons">
            <button class="clear" data-action="clear">AC</button>
            <button data-action="delete">DEL</button>
            <button data-operator="/">÷</button>
            <button data-operator="*">×</button>

            <button data-number="7">7</button>
            <button data-number="8">8</button>
            <button data-number="9">9</button>
            <button data-operator="-">−</button>

            <button data-number="4">4</button>
            <button data-number="5">5</button>
            <button data-number="6">6</button>
            <button data-operator="+">+</button>

            <button data-number="1">1</button>
            <button data-number="2">2</button>
            <button data-number="3">3</button>
            <button class="equals" data-action="calculate">=</button>

            <button data-action="sign">+/−</button>
            <button data-number="0">0</button>
            <button data-action="decimal">.</button>
        </div>
    </main>

    <script src="calculatoer.js"></script>
</body>

</html>
